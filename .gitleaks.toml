title = "knowledge-assistant gitleaks config"

[extend]
useDefault = true

[allowlist]
# Allow only files that contain documented placeholders; keep docs/ and tests/ scanned.
description = "Example placeholders and documented patterns"
paths = [
  '''.env.example''',
  '''docs/phase-1-local-skeleton.md''',
]
regexes = [
  '''CHANGE_ME''',
  '''change-me-now''',
  '''your-password''',
  '''your-key''',
  '''<redacted''',
]
