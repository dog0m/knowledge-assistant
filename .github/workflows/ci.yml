name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r rag/requirements.txt -r rag/requirements-dev.txt

      - name: Python compile check
        run: python -m py_compile rag/main.py rag/settings.py rag/security.py rag/worker.py

      - name: Lint
        run: ruff check rag

      - name: Unit tests
        run: python -m pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Node dependencies
        run: npm install --prefix app

      - name: Node syntax check
        run: |
          node --check app/server.js
          node --check app/public/app.js

      - name: Validate compose config
        run: docker compose config --quiet

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependency audit (pip-audit)
        run: |
          pip install pip-audit
          pip-audit -r rag/requirements.txt || true

  e2e:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - name: Prepare CI environment file
        run: |
          cat > .env <<'ENV'
          POSTGRES_DB=myapp
          POSTGRES_USER=myappuser
          POSTGRES_PASSWORD=ci-password-not-secret
          APP_PORT=8080
          QDRANT_URL=http://qdrant:6333
          RAG_BASE_URL=http://rag:8090
          ADMIN_INITIAL_USERNAME=admin
          ADMIN_INITIAL_PASSWORD=ci-admin-password
          QDRANT_COLLECTION=knowledge_chunks
          MODEL_PROVIDER=ollama
          INTERNAL_API_KEY=ci-internal-token-not-secret
          ENV

      - name: Start app stack
        run: |
          docker compose up -d db qdrant app
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/health > /dev/null; then
              echo "app is healthy"
              break
            fi
            sleep 3
          done

      - name: Verify health endpoint
        run: curl -fsS http://localhost:8080/health

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Playwright
        run: |
          npm install --prefix app -D @playwright/test
          npx --prefix app playwright install --with-deps chromium

      - name: Run Playwright smoke tests
        env:
          BASE_URL: http://localhost:8080
        run: npx --prefix app playwright test -c tests/e2e/playwright.config.js

      - name: Stop stack
        if: always()
        run: docker compose down -v
