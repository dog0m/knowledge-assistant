name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r rag/requirements.txt -r rag/requirements-dev.txt

      - name: Python compile check
        run: python -m py_compile rag/main.py rag/settings.py rag/security.py rag/worker.py

      - name: Lint
        run: ruff check rag

      - name: Unit tests
        run: python -m pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Node dependencies
        run: npm install --prefix app

      - name: Node syntax check
        run: |
          node --check app/server.js
          node --check app/public/app.js

      - name: Validate compose config
        run: docker compose config --quiet

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependency audit (pip-audit)
        run: |
          pip install pip-audit
          pip-audit -r rag/requirements.txt || true

  e2e:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Playwright
        run: |
          npm install -D @playwright/test --prefix app
          npx --prefix app playwright install --with-deps chromium
        continue-on-error: true
