name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r rag/requirements.txt -r rag/requirements-dev.txt

      - name: Python compile check
        run: python -m py_compile rag/main.py rag/settings.py rag/security.py rag/worker.py

      - name: Lint
        run: ruff check rag tests

      - name: Unit tests
        # 集成测试需要 Docker 容器，放到独立的 integration job，保持本任务快速。
        run: python -m pytest -q -m "not integration"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Node dependencies
        run: npm install --prefix app

      - name: Node syntax check
        run: |
          node --check app/server.js
          node --check app/public/app.js
          node --check app/session-store.js

      - name: Node unit tests (session store)
        run: node --test tests/session_store.test.js

      - name: Prepare placeholder env
        run: cp .env.example .env

      - name: Validate compose config
        run: docker compose config --quiet

  integration:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r rag/requirements.txt -r rag/requirements-dev.txt

      - name: Full-chain integration tests (Testcontainers)
        # 真实启动 PostgreSQL 与 Qdrant 容器，验证入库/检索/权限/更新/删除链路。
        run: python -m pytest -q -m integration

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true


      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependency audit (pip-audit)
        run: |
          pip install pip-audit
          pip-audit -r rag/requirements.txt || true

  e2e:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4

      - name: Prepare CI environment file
        run: cp .env.example .env

      - name: Start app stack
        run: |
          docker compose up -d db qdrant app
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8080/health > /dev/null; then
              echo "app is healthy"
              break
            fi
            sleep 3
          done

      - name: Verify health endpoint
        run: curl -fsS http://localhost:8080/health

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Playwright
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Run Playwright smoke tests
        env:
          BASE_URL: http://localhost:8080
        run: npx playwright test -c tests/e2e/playwright.config.js

      - name: Stop stack
        if: always()
        run: docker compose down -v
